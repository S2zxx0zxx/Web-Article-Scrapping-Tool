name: Repair committed archive

on:
  push:
    branches:
      - repair/unpack-archive-20260914

permissions:
  contents: write

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[archive-extracted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - shell: bash
        run: |
          set -euo pipefail
          python3 - "Article-Web-Scraping-main.zip" <<'PY'
          import pathlib, shutil, stat, sys, tempfile, zipfile
          archive=pathlib.Path(sys.argv[1]); temp=pathlib.Path(tempfile.mkdtemp(prefix="archive-repair-"))
          if not archive.is_file(): raise SystemExit(f"Archive not found: {archive}")
          try:
              with zipfile.ZipFile(archive) as zf:
                  infos=zf.infolist()
                  if sum(i.file_size for i in infos)>200*1024*1024: raise SystemExit("Archive too large")
                  for i in infos:
                      p=pathlib.PurePosixPath(i.filename.replace("\\","/"))
                      if p.is_absolute() or ".." in p.parts: raise SystemExit(f"Unsafe ZIP path: {i.filename}")
                      if ((i.external_attr>>16)&0o170000)==stat.S_IFLNK: raise SystemExit(f"Symlink not allowed: {i.filename}")
                  zf.extractall(temp)
              c=list(temp.iterdir()); src=c[0] if len(c)==1 and c[0].is_dir() else temp
              for item in src.iterdir():
                  if item.name==".git": continue
                  d=pathlib.Path.cwd()/item.name
                  shutil.copytree(item,d,dirs_exist_ok=True) if item.is_dir() else shutil.copy2(item,d)
              archive.unlink()
          finally: shutil.rmtree(temp,ignore_errors=True)
          PY
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: extract committed project archive [archive-extracted]"
          git push origin "HEAD:${{ github.ref_name }}"
